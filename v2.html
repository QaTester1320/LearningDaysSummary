import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.By;

public class XPathDemo {

	public static void main(String[] args) {

		WebDriver driver = new ChromeDriver();
		driver.get("https://demo.nopcommerce.com/");
		driver.manage().window().maximize();
		
		//XPath with single attribute
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).sendKeys("T-Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with multiple attributes
		//input[@name='q'][@placeholder="Search store"] <--own xpath made manually 
		driver.findElement(By.xpath("//input[@name='q'][@placeholder=\'Search store\']")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with 'and' operator
		driver.findElement(By.xpath("//input[@name='q' and @placeholder='Search store']")).sendKeys("Tshirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		driver.findElement(By.xpath("//input[@name='q' or @placeholder='Seach store']")).sendKeys("Tshirts");
		
		//xpath with text() - inner text
	//	driver.findElement(By.xpath("//*[text()='Build your own computer']")).click();
		
	//	driver.get("https://demo.nopcommerce.com/");
		
		boolean displaystatus = driver.findElement(By.xpath("//h2[text()='Featured products']")).isDisplayed();
		System.out.println(displaystatus);
		
		String value = driver.findElement(By.xpath("//h2[text()='Featured products']")).getText();
		System.out.println(value);
		
		//xpath with contains()
		driver.findElement(By.xpath("//input[contains(@placeholder,'Sea')]")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		
		//xpath with start-with()
		driver.findElement(By.xpath("//input[starts-with(@placeholder,'Sea')]")).sendKeys("Shirts");

		//chained xpath
		boolean imagestatus = driver.findElement(By.xpath("//div[@class='header-logo']/a/img")).isDisplayed();
		System.out.println(imagestatus);
		
		driver.quit();
		
		
	}

}

import java.time.Duration;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

public class ExplicitDemo {

	public static void main(String[] args) {
		
		WebDriver driver = new ChromeDriver();
		WebDriverWait mywait = new WebDriverWait(driver, Duration.ofSeconds(10));
		
		//get(url) - opens the url on the browser
		driver.get("https://opensource-demo.orangehrmlive.com/web/index.php/auth/login");
		driver.manage().window().maximize();
		
		WebElement txtusername = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder=\'Username\']")));
		txtusername.sendKeys("Admin");
		
		WebElement txtpassword = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder='Password']")));
		txtpassword.sendKeys("Admin");
		
		WebElement loginbtn = mywait.until(ExpectedConditions.elementToBeClickable(By.xpath("//button[normalize-space()='Login']")));
		loginbtn.click();
		
		
		System.out.println("testing is completed...");
		//driver.close();
		driver.quit();
	}

}

public class Assignment {

	public static void main(String[] args) {
		// Set up WebDriver
		WebDriver driver = new ChromeDriver();
		driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
		driver.get("https://testautomationpractice.blogspot.com/");
		driver.manage().window().maximize();

		// Input DOB
		String requiredYear = "2021";
		String requiredMonth = "June";
		String requiredDate = "15";

		// Switch to the iframe containing the date picker
		driver.switchTo().frame("frame-one796456169");

		// Open the date picker
		driver.findElement(By.xpath("//span[@class='icon_calendar']")).click();

		// Select year
		WebElement yearDropDown = driver.findElement(By.xpath("//select[@class='ui-datepicker-year']"));
		Select selectYear = new Select(yearDropDown);
		selectYear.selectByVisibleText(requiredYear);

		// Select month using navigation logic
		selectMonth(driver, requiredMonth);

		// Select date
		selectDate(driver, requiredDate);

		// Close browser after selection
		driver.quit();
	}

	// Method to select the correct month (handles both forward & backward
	// navigation)
	public static void selectMonth(WebDriver driver, String requiredMonth) {
		while (true) {
			// Get the current month displayed in the date picker
			String currentMonth = driver.findElement(By.xpath("//span[@class='ui-datepicker-month']")).getText();

			if (currentMonth.equals(requiredMonth)) {
				break; // If month matches, exit loop
			}

			// Determine direction: Next (>) or Previous (<)
			if (isMonthAfter(currentMonth, requiredMonth)) {
				// Click "Previous" button to navigate back
				driver.findElement(By.xpath("//span[@class='ui-icon ui-icon-circle-triangle-w']")).click();
			} else {
				// Click "Next" button to navigate forward
				driver.findElement(By.xpath("//span[@class='ui-icon ui-icon-circle-triangle-e']")).click();
			}
		}
	}

	// Helper method to compare months for navigation
	public static boolean isMonthAfter(String currentMonth, String requiredMonth) {
		List<String> months = Arrays.asList("January", "February", "March", "April", "May", "June", "July", "August",
				"September", "October", "November", "December");

		return months.indexOf(currentMonth) < months.indexOf(requiredMonth);
	}

	// Method to select the required date
	public static void selectDate(WebDriver driver, String requiredDate) {
		List<WebElement> allDates = driver
				.findElements(By.xpath("//table[@class='ui-datepicker-calendar']//tbody//tr//td"));

		for (WebElement dateElement : allDates) {
			if (dateElement.getText().equals(requiredDate)) {
				dateElement.click();
				break; // Stop loop after selecting date
			}
		}
	}
}`},

                { name: "BrokenLinks.java", code: `package day39;

import java.io.IOException;
import java.net.HttpURLConnection;
import java.net.URL;
import java.util.ArrayList;
import java.util.List;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.chrome.ChromeDriver;

public class BrokenLinks {

    public static final String GREEN = "\u001B[32m";
    public static final String RED = "\u001B[31m";
    public static final String YELLOW = "\u001B[38;5;208m";
    public static final String RESET = "\u001B[0m";

    public static void main(String[] args) throws IOException {

        WebDriver driver = new ChromeDriver();
        driver.get("http://www.deadlinkcity.com/");
        driver.manage().window().maximize();

        List<WebElement> links = driver.findElements(By.tagName("a"));

        List<String> workingLinks = new ArrayList<>();
        List<String> brokenLinks = new ArrayList<>();
        List<String> skippedLinks = new ArrayList<>();

        System.out.println("Total links found: " + links.size());
        System.out.println("Checking links...\n");

        for (WebElement link : links) {

            String href = link.getAttribute("href");
            String text = link.getText();
            String html = link.getAttribute("outerHTML");

            if (href == null || href.isEmpty()) {

                skippedLinks.add(
                        "TEXT: [" + text + "]\n" +
                        "HREF: " + href + "\n" +
                        "ELEMENT: " + html + "\n"
                );
                continue;
            }

            if (href.startsWith("javascript") ||
                href.startsWith("mailto") ||
                href.startsWith("tel")) {

                skippedLinks.add(
                        "TEXT: [" + text + "]\n" +
                        "HREF: " + href + "\n" +
                        "ELEMENT: " + html + "\n"
                );
                continue;
            }

            try {

                @SuppressWarnings("deprecation")
				URL url = new URL(href);
                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                conn.connect();

                if (conn.getResponseCode() >= 400) {
                    brokenLinks.add(href + " | TEXT: " + text);
                } else {
                    workingLinks.add(href + " | TEXT: " + text);
                }

            } catch (Exception e) {
                brokenLinks.add(href + " | ERROR");
            }
        }

        System.out.println("\n========== WORKING LINKS ==========");
        for (String link : workingLinks) {
            System.out.println(GREEN + link + RESET);
        }

        System.out.println("\n========== BROKEN LINKS ==========");
        for (String link : brokenLinks) {
            System.out.println(RED + link + RESET);
        }

        System.out.println("\n========== SKIPPED LINKS ==========");
        for (String link : skippedLinks) {
            System.out.println(YELLOW + link + RESET);
        }

        System.out.println("\n=========== SUMMARY ===========");
        System.out.println(GREEN + "Working Links : " + workingLinks.size() + RESET);
        System.out.println(RED + "Broken Links  : " + brokenLinks.size() + RESET);
        System.out.println(YELLOW + "Skipped Links : " + skippedLinks.size() + RESET);
        System.out.println("Total Links   : " + links.size());

        driver.quit();
    }
}`},

    const dayGrid = document.getElementById('day-grid');

    // Create Navigation Cards
    for (let i = 21; i <= 56; i++) {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
            <h3>Day ${i}</h3>
            <p>${database[i]?.title || 'System Implementation'}</p>
        `;
        card.onclick = () => loadDay(i, card);
        dayGrid.appendChild(card);
    }

    function loadDay(dayId, element) {
        // UI Updates
        document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');

        const data = database[dayId] || {
            title: `Progress Update: Day ${dayId}`,
            desc: `Continuation of automation framework development focusing on scalability and robust error handling for Day ${dayId}.`,
            files: [{ name: "Main.java", code: "// Code for Day " + dayId }]
        };

        // Update Text
        document.getElementById('view-title').innerText = `Day ${dayId}: ${data.title}`;
        document.getElementById('view-desc').innerText = data.desc;

        // Update Tabs
        const tabRow = document.getElementById('tab-row');
        const codeOutput = document.getElementById('code-output');
        tabRow.innerHTML = '';

        data.files.forEach((file, index) => {
            const tab = document.createElement('div');
            tab.className = `file-tab ${index === 0 ? 'active' : ''}`;
            tab.innerText = file.name;
            tab.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                codeOutput.innerText = file.code;
            };
            tabRow.appendChild(tab);
            if(index === 0) codeOutput.innerText = file.code;
        });
    }
</script>
