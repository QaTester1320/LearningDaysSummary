        :root {

            --panel-matte: #1e1e1e;
            --border-matte: #2a2a2a;
            --accent-glow: #3d3d3d;
            --text-silver: #c5c5c5;
            --text-dim: #636363;
            --text-bright: #ffffff;
            --code-green: #a7c080;
            --code-blue: #7fbbb3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-matte);
            color: var(--text-silver);
            font-family: 'Mona Sans', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- NAVIGATION SIDEBAR --- */
        nav {
            width: 320px;
            background-color: var(--surface-matte);
            border-right: 1px solid var(--border-matte);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .nav-header {
            padding: 40px 30px;
        }

        .nav-header h1 {
            font-size: 1.4rem;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }

        .nav-header span {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .day-grid {
            flex: 1;
            overflow-y: overlay;
            padding: 0 20px 40px;
        }

        .day-card {
            background: var(--panel-matte);
            border: 1px solid var(--border-matte);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-card:hover {
            border-color: var(--text-dim);
            transform: translateY(-2px);
            background: #252525;
        }

        .day-card.active {
            border-color: var(--text-bright);
            background: var(--accent-glow);
        }

        .day-card h3 {
            font-size: 0.9rem;
            color: var(--text-bright);
            margin-bottom: 4px;
        }

        .day-card p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* --- MAIN VIEWPORT --- */
        main {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
            position: relative;
        }

        .content-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .explanation-section {
            margin-bottom: 40px;
        }

        .explanation-section h2 {
            font-size: 2.5rem;
            color: var(--text-bright);
            margin-bottom: 20px;
        }

        .explanation-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-matte);
            padding: 25px;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 1rem;
            color: var(--text-silver);
        }

        /* --- IDE WINDOW --- */
        .ide-window {
            background: var(--surface-matte);
            border: 1px solid var(--border-matte);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .ide-toolbar {
            background: #1a1a1a;
            padding: 0 15px;
            height: 45px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-matte);
            /* Prevent the toolbar itself from clipping/growing when there are many tabs */
            overflow: hidden;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-right: 20px;
            flex-shrink: 0; /* keep the dots visible, never squeezed out */
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-matte); }

        .file-tab-container {
            display: flex;
            height: 100%;
            flex: 1 1 auto;
            min-width: 0; /* required so flex child can actually shrink and scroll instead of overflowing */
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin; /* Firefox */
        }

        /* Horizontal scrollbar just for the tab row, kept slim and unobtrusive */
        .file-tab-container::-webkit-scrollbar {
            height: 4px;
        }
        .file-tab-container::-webkit-scrollbar-thumb {
            background: var(--border-matte);
            border-radius: 10px;
        }

        .file-tab {
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            cursor: pointer;
            border-right: 1px solid var(--border-matte);
            flex-shrink: 0; /* keep each tab's full name readable, never squished */
            white-space: nowrap;
        }

        .file-tab.active {
            background: var(--panel-matte);
            color: var(--text-bright);
            border-bottom: 2px solid var(--text-bright);
        }

        .code-area {
    padding: 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--code-blue);
    overflow: auto; /* Changed from overflow-x to auto for vertical scrolling */
    white-space: pre;
    tab-size: 4; /* Ensures Java tabs aren't too wide */
    -moz-tab-size: 4;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-matte); border-radius: 10px; }
    </style>

import org.openqa.selenium.chrome.ChromeDriver;

	public static void main(String[] args) {

		WebDriver driver = new ChromeDriver();
		driver.get("https://demo.nopcommerce.com/");
		driver.manage().window().maximize();
		
		//XPath with single attribute
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).sendKeys("T-Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with multiple attributes
		//input[@name='q'][@placeholder="Search store"] <--own xpath made manually 
		driver.findElement(By.xpath("//input[@name='q'][@placeholder=\'Search store\']")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with 'and' operator
		driver.findElement(By.xpath("//input[@name='q' and @placeholder='Search store']")).sendKeys("Tshirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		driver.findElement(By.xpath("//input[@name='q' or @placeholder='Seach store']")).sendKeys("Tshirts");
		
		//xpath with text() - inner text

		System.out.println(displaystatus);
		
		String value = driver.findElement(By.xpath("//h2[text()='Featured products']")).getText();
		System.out.println(value);
		
		//xpath with contains()
		driver.findElement(By.xpath("//input[contains(@placeholder,'Sea')]")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		
		//xpath with start-with()
		driver.findElement(By.xpath("//input[starts-with(@placeholder,'Sea')]")).sendKeys("Shirts");

		//chained xpath
		boolean imagestatus = driver.findElement(By.xpath("//div[@class='header-logo']/a/img")).isDisplayed();
		System.out.println(imagestatus);
		
		driver.quit();
		
		
	}

}

import java.time.Duration;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

public class ExplicitDemo {

	public static void main(String[] args) {
		
		WebDriver driver = new ChromeDriver();
		WebDriverWait mywait = new WebDriverWait(driver, Duration.ofSeconds(10));
		
		//get(url) - opens the url on the browser
		driver.get("https://opensource-demo.orangehrmlive.com/web/index.php/auth/login");
		driver.manage().window().maximize();
		
		WebElement txtusername = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder=\'Username\']")));
		txtusername.sendKeys("Admin");
		
		WebElement txtpassword = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder='Password']")));
		txtpassword.sendKeys("Admin");
		
		WebElement loginbtn = mywait.until(ExpectedConditions.elementToBeClickable(By.xpath("//button[normalize-space()='Login']")));
		loginbtn.click();
		
		
		System.out.println("testing is completed...");
		//driver.close();
		driver.quit();
	}

}

		driver.get("https://opensource-demo.orangehrmlive.com/web/index.php/auth/login");

import java.time.Duration;

import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.support.ui.Select;

public class Assignment {

	public static void main(String[] args) {
		// Set up WebDriver
		WebDriver driver = new ChromeDriver();
		driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
		driver.get("https://testautomationpractice.blogspot.com/");
		driver.manage().window().maximize();

		// Input DOB
		String requiredYear = "2021";
		String requiredMonth = "June";
		String requiredDate = "15";

		// Switch to the iframe containing the date picker
		driver.switchTo().frame("frame-one796456169");

		// Open the date picker
		driver.findElement(By.xpath("//span[@class='icon_calendar']")).click();

		// Select year
		WebElement yearDropDown = driver.findElement(By.xpath("//select[@class='ui-datepicker-year']"));
		Select selectYear = new Select(yearDropDown);
		selectYear.selectByVisibleText(requiredYear);

		// Select month using navigation logic
		selectMonth(driver, requiredMonth);

		// Select date
		selectDate(driver, requiredDate);

		// Close browser after selection
		driver.quit();
	}

	// Method to select the correct month (handles both forward & backward
	// navigation)
	public static void selectMonth(WebDriver driver, String requiredMonth) {
		while (true) {
			// Get the current month displayed in the date picker
			String currentMonth = driver.findElement(By.xpath("//span[@class='ui-datepicker-month']")).getText();

			if (currentMonth.equals(requiredMonth)) {
				break; // If month matches, exit loop
			}

			// Determine direction: Next (>) or Previous (<)
			if (isMonthAfter(currentMonth, requiredMonth)) {
				// Click "Previous" button to navigate back
				driver.findElement(By.xpath("//span[@class='ui-icon ui-icon-circle-triangle-w']")).click();
			} else {
				// Click "Next" button to navigate forward
				driver.findElement(By.xpath("//span[@class='ui-icon ui-icon-circle-triangle-e']")).click();
			}
		}
	}

	// Helper method to compare months for navigation
	public static boolean isMonthAfter(String currentMonth, String requiredMonth) {
		List<String> months = Arrays.asList("January", "February", "March", "April", "May", "June", "July", "August",
				"September", "October", "November", "December");

		return months.indexOf(currentMonth) < months.indexOf(requiredMonth);
	}

	// Method to select the required date
	public static void selectDate(WebDriver driver, String requiredDate) {
		List<WebElement> allDates = driver
				.findElements(By.xpath("//table[@class='ui-datepicker-calendar']//tbody//tr//td"));

		for (WebElement dateElement : allDates) {
			if (dateElement.getText().equals(requiredDate)) {
				dateElement.click();
				break; // Stop loop after selecting date
			}
		}
	}
}`},

                { name: "BrokenLinks.java", code: `package day39;

import java.io.IOException;
import java.net.HttpURLConnection;
import java.net.URL;
import java.util.ArrayList;
import java.util.List;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.chrome.ChromeDriver;

public class BrokenLinks {

    public static final String GREEN = "\u001B[32m";
    public static final String RED = "\u001B[31m";
    public static final String YELLOW = "\u001B[38;5;208m";
    public static final String RESET = "\u001B[0m";

    public static void main(String[] args) throws IOException {

        WebDriver driver = new ChromeDriver();
        driver.get("http://www.deadlinkcity.com/");
        driver.manage().window().maximize();

        List<WebElement> links = driver.findElements(By.tagName("a"));

        List<String> workingLinks = new ArrayList<>();
        List<String> brokenLinks = new ArrayList<>();
        List<String> skippedLinks = new ArrayList<>();

        System.out.println("Total links found: " + links.size());
        System.out.println("Checking links...\n");

        for (WebElement link : links) {

            String href = link.getAttribute("href");
            String text = link.getText();
            String html = link.getAttribute("outerHTML");

            if (href == null || href.isEmpty()) {

                skippedLinks.add(
                        "TEXT: [" + text + "]\n" +
                        "HREF: " + href + "\n" +
                        "ELEMENT: " + html + "\n"
                );
                continue;
            }

            if (href.startsWith("javascript") ||
                href.startsWith("mailto") ||
                href.startsWith("tel")) {

                skippedLinks.add(
                        "TEXT: [" + text + "]\n" +
                        "HREF: " + href + "\n" +
                        "ELEMENT: " + html + "\n"
                );
                continue;
            }

            try {

                @SuppressWarnings("deprecation")
				URL url = new URL(href);
                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                conn.connect();

                if (conn.getResponseCode() >= 400) {
                    brokenLinks.add(href + " | TEXT: " + text);
                } else {
                    workingLinks.add(href + " | TEXT: " + text);
                }

            } catch (Exception e) {
                brokenLinks.add(href + " | ERROR");
            }
        }

        System.out.println("\n========== WORKING LINKS ==========");
        for (String link : workingLinks) {
            System.out.println(GREEN + link + RESET);
        }

        System.out.println("\n========== BROKEN LINKS ==========");
        for (String link : brokenLinks) {
            System.out.println(RED + link + RESET);
        }

        System.out.println("\n========== SKIPPED LINKS ==========");
        for (String link : skippedLinks) {
            System.out.println(YELLOW + link + RESET);
        }

        System.out.println("\n=========== SUMMARY ===========");
        System.out.println(GREEN + "Working Links : " + workingLinks.size() + RESET);
        System.out.println(RED + "Broken Links  : " + brokenLinks.size() + RESET);
        System.out.println(YELLOW + "Skipped Links : " + skippedLinks.size() + RESET);
        System.out.println("Total Links   : " + links.size());

        driver.quit();
    }
}`},

import org.apache.poi.ss.usermodel.CellStyle;
import org.apache.poi.ss.usermodel.DataFormatter;

import org.apache.poi.ss.usermodel.IndexedColors;

import org.apache.poi.xssf.usermodel.XSSFRow;
import org.apache.poi.xssf.usermodel.XSSFSheet;
import org.apache.poi.xssf.usermodel.XSSFWorkbook;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.IOException;

public class ExcelUtils {
	
	public static FileInputStream fi;
	public static FileOutputStream fo;
	public static XSSFWorkbook wb;
	public static XSSFSheet ws;
	public static XSSFRow row;
	public static XSSFCell cell;
	public static CellStyle style;
	
	public static int getRowCount(String xlfile, String xlsheet) throws IOException{
		
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		int rowcount = ws.getLastRowNum();
		wb.close();
		fi.close();
		return rowcount;
	}
	
	public static int getCellCount ( String xlfile, String xlsheet, int rownum) throws IOException {
		
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		row = ws.getRow(rownum);
		int cellcount = row.getLastCellNum();
		wb.close();
		fi.close();
		return cellcount;
	}
	
	public static String getCellData(String xlfile, String xlsheet, int rownum, int colnum) throws IOException {
		
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		row = ws.getRow(rownum);
		cell = row.getCell(colnum);
		
		String data;
		try {
			
			//data = cell.toString();
			DataFormatter formatter = new DataFormatter();
			data = formatter.formatCellValue(cell); //retruns the formated value of a cell as a String regardless of the cell type.
		}
		catch (Exception e) {
			data = "";
		}
		
		wb.close();
		fi.close();
		return data;
	}
	
	public static void setCellData ( String xlfile, String xlsheet, int rownum, int colnum, String data) throws IOException {
		
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		row = ws.getRow(rownum);
		cell = row.getCell(colnum);
		cell.setCellValue(data);
		fo = new FileOutputStream(xlfile);
		wb.write(fo);
	    wb.close();
		fi.close();
		fo.close();
	}
	
	public static void fillGreenColor (String xlfile, String xlsheet, int rownum, int colnum) throws IOException {
		
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		row = ws.getRow(rownum);
		cell = row.getCell(colnum);
		
		style = wb.createCellStyle();
		
		style.setFillForegroundColor(IndexedColors.GREEN.getIndex());
		style.setFillPattern(FillPatternType.SOLID_FOREGROUND);
		
		cell.setCellStyle(style);
		fo = new FileOutputStream(xlfile);
		wb.write(fo);
		wb.close();
		fi.close();
		fo.close();
	}
	
	public static void fillRedColor (String xlfile, String xlsheet, int rownum, int colnum) throws IOException {
		fi = new FileInputStream(xlfile);
		wb = new XSSFWorkbook(fi);
		ws = wb.getSheet(xlsheet);
		row = ws.getRow(rownum);
		cell = row.getCell(colnum);

		fi.close();
		fo.close();
	}

	public static void main(String[] args) throws IOException, InterruptedException {
		
		
		WebDriver driver = new ChromeDriver();
		driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
		driver.get("https://qatester1320.github.io/FixDepositeCalculator/");
		driver.manage().window().maximize();
		
		String filePath = System.getProperty("user.dir")+"\\testdata\\FixDepositeCalcData.xlsx";
		
		int rows = ExcelUtils.getRowCount(filePath, "Sheet1");
		
		for(int i=1;i<=rows;i++) {
			
			//read data from excel
			String princ = ExcelUtils.getCellData(filePath, "Sheet1", i, 0);
			String rateOfInterest = ExcelUtils.getCellData(filePath, "Sheet1", i, 1);
			String per1 = ExcelUtils.getCellData(filePath, "Sheet1", i, 2);
			String per2 = ExcelUtils.getCellData(filePath, "Sheet1", i, 3);
			String fre = ExcelUtils.getCellData(filePath, "Sheet1", i, 4);
			String exp_mValue = ExcelUtils.getCellData(filePath, "Sheet1", i, 5);
			
			//pas above data into application
			driver.findElement(By.xpath("//input[@id='principal']")).sendKeys(princ);
			driver.findElement(By.xpath("//input[@id='rate']")).sendKeys(rateOfInterest);
			driver.findElement(By.xpath("//input[@id='periodValue']")).sendKeys(per1);
			
			Select perdrop = new Select(driver.findElement(By.xpath("//select[@id='periodUnit']")));
			perdrop.selectByVisibleText(per2);
			
			Select fredrp = new Select (driver.findElement(By.xpath("//select[@id='frequency']")));
			fredrp.selectByVisibleText(fre);	
			
			driver.findElement(By.xpath("//button[normalize-space()='CALCULATE']")).click();
			
			//validation
			String act_mvalue = driver.findElement(By.xpath("//span[@id='res-total']")).getText();
			act_mvalue = act_mvalue.replace("₹", "").replace(",", "");

			double expected = Double.parseDouble(exp_mValue);
			double actual = Double.parseDouble(act_mvalue);

			if(expected == actual) {
				System.out.println("Test passed...");
				ExcelUtils.setCellData(filePath, "Sheet1", i, 7, "Passed");
				ExcelUtils.fillGreenColor(filePath, "Sheet1", i, 7);

				ExcelUtils.setCellData(filePath, "Sheet1", i, 7, "Failed");
				ExcelUtils.fillRedColor(filePath, "Sheet1", i, 7);
			}
			Thread.sleep(3000);

	}

import com.aventstack.extentreports.Status;
import com.aventstack.extentreports.reporter.ExtentSparkReporter;
import com.aventstack.extentreports.reporter.configuration.Theme;

public class ExtentReportManager implements ITestListener

//ExtentReportManager==utility file
{
	public ExtentSparkReporter sparkReporter; // UI of the report
	public ExtentReports extent; //populate common info on the report
	public ExtentTest test; // creating test case entries in the report and update status of the test methods
	
	public void onStart(ITestContext context) 
	{
		sparkReporter=new ExtentSparkReporter(System.getProperty("user.dir")+ "/reports/myReport.html");//specit
	    sparkReporter.config().setDocumentTitle("Automation Report"); // TiTle of report
	    sparkReporter.config().setReportName("Functional Testing"); // name of the report
	    sparkReporter.config().setTheme(Theme.STANDARD);
	 
	    extent=new ExtentReports();
	    extent.attachReporter(sparkReporter);
	 
	    extent.setSystemInfo("Computer Name","localhost");
		extent.setSystemInfo("Environment","QA");
		extent.setSystemInfo("Tester Name","Dhara");
		extent.setSystemInfo("os", "Windows10");
		extent.setSystemInfo("Browser Name","Chrome");
	}
	 
	public void onTestSuccess(ITestResult result) 
	{
		test = extent.createTest(result.getName()); // create a new entry in the report
		test.log(Status.PASS, "Test case PASSED is:"+ result.getName()); // update status p/f/s
			 
			 
	}
	public void onTestFailure(ITestResult result) 
	{
		test = extent.createTest(result.getName());
		test.log(Status.FAIL, "Test case FAILED is:" + result.getName());
		test.log(Status.FAIL, "Test Case FAILED cause is: "+ result.getThrowable());
	}		 
	
	public void onTestSkipped(ITestResult result) 
	{
		test = extent.createTest(result.getName());
		test.log(Status.SKIP, "Test case SKIPPED is: "+ result.getName());
	}
	public void onFinish(ITestContext context) 
	{
		extent.flush();
	}

    function loadDay(dayId, element) {
        // UI Updates
        document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));

        const data = database[dayId] || {
            title: `Progress Update: Day ${dayId}`,
            desc: `Continuation of automation framework development focusing on scalability and robust error handling for Day ${dayId}.`,
            files: [{ name: "Main.java", code: "// Code for Day " + dayId }]
        };

        // Update Text
        document.getElementById('view-title').innerText = `Day ${dayId}: ${data.title}`;
        document.getElementById('view-desc').innerText = data.desc;

        // Update Tabs
        const tabRow = document.getElementById('tab-row');
        const codeOutput = document.getElementById('code-output');
        tabRow.innerHTML = '';

        data.files.forEach((file, index) => {
            const tab = document.createElement('div');
            tab.className = `file-tab ${index === 0 ? 'active' : ''}`;
            tab.innerText = file.name;
            tab.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                codeOutput.innerText = file.code;
            };
            tabRow.appendChild(tab);
            if(index === 0) codeOutput.innerText = file.code;
        });
    }
