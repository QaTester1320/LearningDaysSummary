import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.By;

public class XPathDemo {

	public static void main(String[] args) {

		WebDriver driver = new ChromeDriver();
		driver.get("https://demo.nopcommerce.com/");
		driver.manage().window().maximize();
		
		//XPath with single attribute
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).sendKeys("T-Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with multiple attributes
		//input[@name='q'][@placeholder="Search store"] <--own xpath made manually 
		driver.findElement(By.xpath("//input[@name='q'][@placeholder=\'Search store\']")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();
		
		//xpath with 'and' operator
		driver.findElement(By.xpath("//input[@name='q' and @placeholder='Search store']")).sendKeys("Tshirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		driver.findElement(By.xpath("//input[@name='q' or @placeholder='Seach store']")).sendKeys("Tshirts");
		
		//xpath with text() - inner text
	//	driver.findElement(By.xpath("//*[text()='Build your own computer']")).click();
		
	//	driver.get("https://demo.nopcommerce.com/");
		
		boolean displaystatus = driver.findElement(By.xpath("//h2[text()='Featured products']")).isDisplayed();
		System.out.println(displaystatus);
		
		String value = driver.findElement(By.xpath("//h2[text()='Featured products']")).getText();
		System.out.println(value);
		
		//xpath with contains()
		driver.findElement(By.xpath("//input[contains(@placeholder,'Sea')]")).sendKeys("Shirts");
		
		driver.findElement(By.xpath("//input[@id='small-searchterms']")).clear();

		
		//xpath with start-with()
		driver.findElement(By.xpath("//input[starts-with(@placeholder,'Sea')]")).sendKeys("Shirts");

		//chained xpath
		boolean imagestatus = driver.findElement(By.xpath("//div[@class='header-logo']/a/img")).isDisplayed();
		System.out.println(imagestatus);
		
		driver.quit();
		
		
	}

}

import java.time.Duration;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.chrome.ChromeDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

public class ExplicitDemo {

	public static void main(String[] args) {
		
		WebDriver driver = new ChromeDriver();
		WebDriverWait mywait = new WebDriverWait(driver, Duration.ofSeconds(10));
		
		//get(url) - opens the url on the browser
		driver.get("https://opensource-demo.orangehrmlive.com/web/index.php/auth/login");
		driver.manage().window().maximize();
		
		WebElement txtusername = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder=\'Username\']")));
		txtusername.sendKeys("Admin");
		
		WebElement txtpassword = mywait.until(ExpectedConditions.visibilityOfElementLocated(By.xpath("//input[@placeholder='Password']")));
		txtpassword.sendKeys("Admin");
		
		WebElement loginbtn = mywait.until(ExpectedConditions.elementToBeClickable(By.xpath("//button[normalize-space()='Login']")));
		loginbtn.click();
		
		
		System.out.println("testing is completed...");
		//driver.close();
		driver.quit();
	}

}

		WebDriver driver = new ChromeDriver();

		driver.get("https://the-internet.herokuapp.com/javascript_alerts");
		driver.manage().window().maximize();

		driver.findElement(By.xpath("//button[normalize-space()='Click for JS Alert']")).click();
		
		Alert myalert = mywait.until(ExpectedConditions.alertIsPresent());
		
		System.out.println(myalert.getText());
		myalert.accept();
		Thread.sleep(5000);
	}

}

            files: [{ name: "Main.java", code: "// Code for Day " + dayId }]
        };

        // Update Text
        document.getElementById('view-title').innerText = `Day ${dayId}: ${data.title}`;
        document.getElementById('view-desc').innerText = data.desc;

        // Update Tabs
        const tabRow = document.getElementById('tab-row');
        const codeOutput = document.getElementById('code-output');
        tabRow.innerHTML = '';

        data.files.forEach((file, index) => {
            const tab = document.createElement('div');
            tab.className = `file-tab ${index === 0 ? 'active' : ''}`;
            tab.innerText = file.name;
            tab.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

            };
